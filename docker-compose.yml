version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres-db

    restart: always

    environment:
      POSTGRES_DB: companydb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  flaskapp:
    build:
      context: ./login_app

    container_name: flask-login-app

    restart: always

    depends_on:
      - postgres

    ports:
      - "5000:5000"

    volumes:
      - ./login_app:/app

    environment:
      DB_HOST: postgres
      DB_NAME: companydb
      DB_USER: admin
      DB_PASSWORD: admin123

volumes:
  postgres_data: